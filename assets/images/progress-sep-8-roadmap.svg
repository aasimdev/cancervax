<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124 573" role="img" aria-labelledby="title desc">
  <title id="title">CancerVax development progress</title>
  <desc id="desc">Roadmap showing the Universal Cancer Treatment Platform, Pancreatic Cancer, and Liver Cancers progressing through discovery, optimization, pre-clinical, and clinical stages.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#173e45" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="1092" height="541" rx="32" fill="url(#panel)" stroke="#cfe2e4" stroke-width="2" filter="url(#shadow)"/>
  <path d="M48 16h1028a32 32 0 0 1 32 32v54H16V48a32 32 0 0 1 32-32Z" fill="#2f7f85"/>
  <path d="M16 94H1108V102H16Z" fill="#41b7bc"/>
