  </defs>

  <rect x="16" y="16" width="568" height="1018" rx="32" fill="#fff" stroke="#cfe2e4" stroke-width="2" filter="url(#shadow)"/>
  <path d="M48 16h504a32 32 0 0 1 32 32v94H16V48a32 32 0 0 1 32-32Z" fill="#2f7f85"/>
