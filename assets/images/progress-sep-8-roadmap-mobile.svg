<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1050" role="img" aria-labelledby="title desc">
  <title id="title">CancerVax mobile development progress</title>
  <desc id="desc">Vertical roadmap showing the Universal Cancer Treatment Platform, Pancreatic Cancer, and Liver Cancers progressing through discovery, optimization, pre-clinical, and clinical stages.</desc>
  <defs>
